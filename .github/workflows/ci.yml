name: ci

on:
  push:
  pull_request:

jobs:
  docs-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: docs hygiene
        run: python scripts/check_docs.py
      - name: release workflow lint
        run: python scripts/check_release_workflow.py
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1.34.2 lint api/openapi.yaml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: unit tests
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: race tests
        run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build test image
        run: docker build -t netp2p-test:latest .
      - name: userspace end-to-end
        run: sudo -E scripts/e2e.sh --with-tun --with-exit --with-multihop --with-quota --with-chaos

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: VITE_NETP2P_VERSION=0.0.0-dev npm run build
      - run: npx vitest run

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        run: cd ui && npm ci --no-audit --no-fund && VITE_NETP2P_VERSION=0.0.0-dev npm run build
      - name: Build Linux artifacts
        run: make package-linux package-tarball VERSION=0.0.0-dev SKIP_UI=1
      - name: Install and smoke-test the DEB
        run: |
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587 \
            /bin/sh -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y /dist/netp2p_0.0.0~dev_amd64.deb && /usr/bin/netp2p version && test -f /lib/systemd/system/netp2p-client.service'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        shell: pwsh
        run: |
          cd ui
          npm ci --no-audit --no-fund
          $env:VITE_NETP2P_VERSION = '0.0.0-dev'
          npm run build
      - name: Windows tests
        run: go test ./...
      - name: Install WiX
        # WiX v7 requires accepting a separate OSMF EULA; CI must stay noninteractive.
        run: dotnet tool install --global wix --version 6.0.2
      - name: Build Windows MSI
        shell: pwsh
        # WiX requires a numeric ProductVersion even for CI smoke builds.
        run: packaging/windows/build.ps1 -Version 0.0.0 -BinDir dist/windows -OutDir dist

  build-other:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: cross build
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: "0"
        run: go build ./...
