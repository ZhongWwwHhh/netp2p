name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: unit tests
        run: go test ./cmd/... ./internal/...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: race tests
        run: go test -race ./cmd/... ./internal/...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build test image
        run: docker build -t netp2p-test:latest .
      - name: userspace end-to-end
        run: sudo -E scripts/e2e.sh

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: VITE_NETP2P_VERSION=0.0.0-dev npm run build
      - run: npx vitest run

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        run: cd ui && npm ci --no-audit --no-fund && VITE_NETP2P_VERSION=0.0.0-dev npm run build
      - name: Build Linux artifacts
        run: make package-linux package-tarball VERSION=0.0.0-dev SKIP_UI=1
      - name: Install and smoke-test the DEB
        run: |
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            debian:bookworm-slim \
            /bin/sh -c 'dpkg -i /dist/netp2p_0.0.0-dev_amd64.deb && /usr/bin/netp2p version && test -f /lib/systemd/system/netp2p-client.service'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        shell: pwsh
        run: |
          cd ui
          npm ci --no-audit --no-fund
          $env:VITE_NETP2P_VERSION = '0.0.0-dev'
          npm run build
      - name: Windows tests
        run: go test ./cmd/... ./internal/e2e
      - name: Install WiX
        run: dotnet tool install --global wix
      - name: Build Windows MSI
        shell: pwsh
        # WiX requires a numeric ProductVersion even for CI smoke builds.
        run: packaging/windows/build.ps1 -Version 0.0.0 -BinDir dist/windows -OutDir dist

  build-other:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: cross build
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: "0"
        run: go build ./...
