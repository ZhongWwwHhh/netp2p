# Four-manager BFT committee plus userspace clients. No TUN and no NET_ADMIN are
# required: the data plane runs over libp2p QUIC and a local UDP packet endpoint.
#
# Build once with:  docker build -t netp2p-test:latest .
# Set MANAGER1_PEER_ID (see deploy/compose.env) so clients dial manager-1.
services:
  manager-1:
    image: netp2p-test:latest
    environment:
      NETP2P_MANAGER_ID: manager-1
    volumes: ["./deploy:/config:ro"]
    command: ["--role", "manager", "--data-dir", "/data", "--config", "/config/state.json", "--listen", "/ip4/0.0.0.0/udp/4001/quic-v1", "--web-listen", "0.0.0.0:8080"]
    ports:
      - "8080:8080"
      - "4101:4101/udp"
  manager-2:
    image: netp2p-test:latest
    command: ["--role", "manager", "--data-dir", "/data", "--config", "/config/state.json", "--listen", "/ip4/0.0.0.0/udp/4001/quic-v1", "--web-listen", "0.0.0.0:8080"]
    environment:
      NETP2P_MANAGER_ID: manager-2
    volumes: ["./deploy:/config:ro"]
    ports:
      - "8081:8080"
      - "4102:4102/udp"
  manager-3:
    image: netp2p-test:latest
    command: ["--role", "manager", "--data-dir", "/data", "--config", "/config/state.json", "--listen", "/ip4/0.0.0.0/udp/4001/quic-v1", "--web-listen", "0.0.0.0:8080"]
    environment:
      NETP2P_MANAGER_ID: manager-3
    volumes: ["./deploy:/config:ro"]
    ports:
      - "8082:8080"
      - "4103:4103/udp"
  manager-4:
    image: netp2p-test:latest
    command: ["--role", "manager", "--data-dir", "/data", "--config", "/config/state.json", "--listen", "/ip4/0.0.0.0/udp/4001/quic-v1", "--web-listen", "0.0.0.0:8080"]
    environment:
      NETP2P_MANAGER_ID: manager-4
    volumes: ["./deploy:/config:ro"]
    ports:
      - "8083:8080"
      - "4104:4104/udp"

  client-a:
    image: netp2p-test:latest
    depends_on: [manager-1]
    command: ["--role", "client", "--data-dir", "/data", "--listen", "/ip4/0.0.0.0/udp/5001/quic-v1",
      "--manager", "/dns4/manager-1/udp/4001/quic-v1/p2p/${MANAGER1_PEER_ID}",
      "--setup-key", "setup-key-a", "--packet-listen", "127.0.0.1:51820", "--status-file", "/status/client-a.json"]
    volumes: ["./deploy/run:/status"]
  client-b:
    image: netp2p-test:latest
    depends_on: [manager-1]
    command: ["--role", "client", "--data-dir", "/data", "--listen", "/ip4/0.0.0.0/udp/5001/quic-v1",
      "--manager", "/dns4/manager-1/udp/4001/quic-v1/p2p/${MANAGER1_PEER_ID}",
      "--setup-key", "setup-key-b", "--packet-listen", "127.0.0.1:51820", "--status-file", "/status/client-b.json"]
    volumes: ["./deploy/run:/status"]
  # Started on demand to prove a quorum still certifies with one manager down.
  client-c:
    image: netp2p-test:latest
    profiles: ["quorum"]
    depends_on: [manager-1]
    command: ["--role", "client", "--data-dir", "/data", "--listen", "/ip4/0.0.0.0/udp/5001/quic-v1",
      "--manager", "/dns4/manager-1/udp/4001/quic-v1/p2p/${MANAGER1_PEER_ID}",
      "--setup-key", "setup-key-a", "--packet-listen", "127.0.0.1:51820", "--status-file", "/status/client-c.json"]
    volumes: ["./deploy/run:/status"]
