# Three-manager BFT committee plus userspace clients. No TUN and no NET_ADMIN are
# required: the data plane runs over libp2p QUIC and a local UDP packet endpoint.
#
# Build once with:  docker build -t netp2p-test:latest .
# Set MANAGER1_PEER_ID (see deploy/compose.env) so clients dial manager-1.
services:
  # Lab identity provider. Managers verify ID tokens against it; the console
  # reaches it through the manager's /auth proxy so it never needs a hostname
  # the browser can resolve.
  mock-idp:
    image: netp2p-test:latest
    entrypoint: ["netp2p-mockidp"]
    command: ["--listen", "0.0.0.0:9999", "--issuer", "http://mock-idp:9999",
      "--subject", "sso-user-1", "--email", "sso-user@example.com", "--name", "SSO Admin",
      "--groups", "netp2p-admins,eng"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9999"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    ports:
      - "9999:9999"
  manager-1:
    image: netp2p-test:latest
    depends_on:
      mock-idp:
        condition: service_healthy
    environment:
      NETP2P_MANAGER_ID: manager-1
    volumes: ["./deploy:/config:ro"]
    # manager-1 exposes Prometheus metrics so the e2e script can assert the
    # observability surface, which is otherwise only reachable over libp2p.
    command: ["--role", "manager", "--data-dir", "/data", "--config", "/config/state.json", "--listen", "/ip4/0.0.0.0/udp/4001/quic-v1", "--web-listen", "0.0.0.0:8080", "--metrics-listen", "0.0.0.0:9100"]
    ports:
      - "8080:8080"
      - "4101:4101/udp"
      - "9100:9100"
  manager-2:
    image: netp2p-test:latest
    depends_on:
      mock-idp:
        condition: service_healthy
    command: ["--role", "manager", "--data-dir", "/data", "--config", "/config/state.json", "--listen", "/ip4/0.0.0.0/udp/4001/quic-v1", "--web-listen", "0.0.0.0:8080"]
    environment:
      NETP2P_MANAGER_ID: manager-2
    volumes: ["./deploy:/config:ro"]
    ports:
      - "8081:8080"
      - "4102:4102/udp"
  manager-3:
    image: netp2p-test:latest
    depends_on:
      mock-idp:
        condition: service_healthy
    command: ["--role", "manager", "--data-dir", "/data", "--config", "/config/state.json", "--listen", "/ip4/0.0.0.0/udp/4001/quic-v1", "--web-listen", "0.0.0.0:8080"]
    environment:
      NETP2P_MANAGER_ID: manager-3
    volumes: ["./deploy:/config:ro"]
    ports:
      - "8082:8080"
      - "4103:4103/udp"
  client-a:
    image: netp2p-test:latest
    depends_on: [manager-1]
    command: ["--role", "client", "--data-dir", "/data", "--listen", "/ip4/0.0.0.0/udp/5001/quic-v1",
      "--manager", "/dns4/manager-1/udp/4001/quic-v1/p2p/${MANAGER1_PEER_ID}",
      "--setup-key", "setup-key-a", "--packet-listen", "127.0.0.1:51820", "--status-file", "/status/client-a.json"]
    volumes: ["./deploy/run:/status"]
  client-b:
    image: netp2p-test:latest
    depends_on: [manager-1]
    command: ["--role", "client", "--data-dir", "/data", "--listen", "/ip4/0.0.0.0/udp/5001/quic-v1",
      "--manager", "/dns4/manager-1/udp/4001/quic-v1/p2p/${MANAGER1_PEER_ID}",
      "--setup-key", "setup-key-b", "--packet-listen", "127.0.0.1:51820", "--status-file", "/status/client-b.json"]
    volumes: ["./deploy/run:/status"]

  # SSO client: registers through the device flow instead of a setup key and
  # inherits its groups from the IdP claims.
  client-sso:
    image: netp2p-test:latest
    profiles: ["sso"]
    depends_on: [manager-1, mock-idp]
    command: ["--role", "client", "--data-dir", "/data", "--listen", "/ip4/0.0.0.0/udp/5001/quic-v1",
      "--manager", "/dns4/manager-1/udp/4001/quic-v1/p2p/${MANAGER1_PEER_ID}",
      "--sso", "--sso-issuer", "http://mock-idp:9999", "--sso-client-id", "netp2p",
      "--packet-listen", "127.0.0.1:51820", "--status-file", "/status/client-sso.json"]
    volumes: ["./deploy/run:/status", "client-sso-data:/data"]
  # Started on demand to prove a quorum still certifies with one manager down.
  client-c:
    image: netp2p-test:latest
    profiles: ["quorum"]
    depends_on: [manager-1]
    command: ["--role", "client", "--data-dir", "/data", "--listen", "/ip4/0.0.0.0/udp/5001/quic-v1",
      "--manager", "/dns4/manager-1/udp/4001/quic-v1/p2p/${MANAGER1_PEER_ID}",
      "--setup-key", "setup-key-a", "--packet-listen", "127.0.0.1:51820", "--status-file", "/status/client-c.json"]
    volumes: ["./deploy/run:/status"]

  # Real TUN clients. These need NET_ADMIN and /dev/net/tun, so they live
  # behind the "tun" profile and are not started by the unprivileged default
  # stack. Traffic is driven with plain ping/nc instead of netp2p-probe.
  client-a-tun:
    image: netp2p-test:latest
    profiles: ["tun"]
    depends_on: [manager-1]
    cap_add: [NET_ADMIN, MKNOD]
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p /dev/net
        [ -e /dev/net/tun ] || mknod /dev/net/tun c 10 200
        exec /usr/local/bin/netp2pd --role client --data-dir /data \
          --listen /ip4/0.0.0.0/udp/5001/quic-v1 \
          --manager /dns4/manager-1/udp/4001/quic-v1/p2p/${MANAGER1_PEER_ID} \
          --setup-key setup-key-a --tun netp2p0 --hostname client-a-tun \
          --status-file /status/client-a-tun.json
    volumes: ["./deploy/run:/status", "client-a-tun-data:/data"]
    environment:
      NETP2P_DEBUG_DATA: "1"
    healthcheck:
      test: ["CMD-SHELL", "ip link show netp2p0 && ip addr show netp2p0 | grep -q 'inet 100.64.'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
  client-b-tun:
    image: netp2p-test:latest
    profiles: ["tun"]
    depends_on: [manager-1]
    cap_add: [NET_ADMIN, MKNOD]
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p /dev/net
        [ -e /dev/net/tun ] || mknod /dev/net/tun c 10 200
        exec /usr/local/bin/netp2pd --role client --data-dir /data \
          --listen /ip4/0.0.0.0/udp/5001/quic-v1 \
          --manager /dns4/manager-1/udp/4001/quic-v1/p2p/${MANAGER1_PEER_ID} \
          --setup-key setup-key-b --tun netp2p0 --hostname client-b-tun \
          --status-file /status/client-b-tun.json
    volumes: ["./deploy/run:/status", "client-b-tun-data:/data"]
    environment:
      NETP2P_DEBUG_DATA: "1"
    healthcheck:
      test: ["CMD-SHELL", "ip link show netp2p0 && ip addr show netp2p0 | grep -q 'inet 100.64.'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  # Exit-node scenario. client-exit-tun is a normal overlay client that is also
  # attached to a foreign "public" subnet; an admin transition promotes it to an
  # exit node and certifies a route for that subnet. client-a-tun then reaches
  # the subnet target through the overlay, with the gateway doing kernel SNAT.
  client-exit-tun:
    image: netp2p-test:latest
    profiles: ["exit"]
    depends_on: [manager-1]
    cap_add: [NET_ADMIN, MKNOD]
    sysctls: ["net.ipv4.ip_forward=1", "net.ipv4.conf.all.forwarding=1"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p /dev/net
        [ -e /dev/net/tun ] || mknod /dev/net/tun c 10 200
        exec /usr/local/bin/netp2pd --role client --data-dir /data \
          --listen /ip4/0.0.0.0/udp/5001/quic-v1 \
          --manager /dns4/manager-1/udp/4001/quic-v1/p2p/${MANAGER1_PEER_ID} \
          --setup-key setup-key-exit --tun netp2p0 --hostname client-exit-tun \
          --status-file /status/client-exit-tun.json
    volumes: ["./deploy/run:/status", "client-exit-tun-data:/data"]
    environment:
      NETP2P_DEBUG_DATA: "1"
    networks:
      default:
      subnet-net:
        ipv4_address: 198.18.0.20
    healthcheck:
      test: ["CMD-SHELL", "ip link show netp2p0 && ip addr show netp2p0 | grep -q 'inet 100.64.'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  # A plain host on the foreign subnet. The kernel answers ICMP and a listener
  # serves TCP, so the source client can verify real end-to-end connectivity.
  subnet-target:
    image: netp2p-test:latest
    profiles: ["exit"]
    entrypoint: ["sleep", "infinity"]
    networks:
      subnet-net:
        ipv4_address: 198.18.0.10

  # Long-lived container used to submit admin transitions (promote the exit
  # node, certify the subnet route) from the e2e script.
  admin-cli:
    image: netp2p-test:latest
    profiles: ["exit", "multihop", "quota", "chaos"]
    entrypoint: ["sleep", "infinity"]
    volumes: ["./deploy:/config:ro"]

networks:
  subnet-net:
    ipam:
      config:
        - subnet: 198.18.0.0/24

volumes:
  client-a-tun-data:
  client-b-tun-data:
  client-sso-data:
  client-exit-tun-data:
