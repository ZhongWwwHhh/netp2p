version: 1
role: node
dataDir: /var/lib/netp2p
listen: /ip4/0.0.0.0/udp/4001/quic-v1
webListen: 0.0.0.0:8080
metricsListen: 127.0.0.1:9100
ipc:
  path: /run/netp2p/netp2pd.sock

alert:
  webhook: ""
  webhookSecret: ""
  interval: 15s
  dropCount: 100
  dropRatePercent: 5

# Client-only settings:
# trust: /etc/netp2p/client-trust.json
