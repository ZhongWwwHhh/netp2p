name: netp2p
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: NetP2P <maintainers@netp2p.example>
description: |
  Decentralized overlay VPN with a BFT committee control plane.
  This package installs the netp2pd daemon, netp2p CLI, and systemd unit.
vendor: NetP2P
homepage: https://github.com/ZhongWwwHhh/netp2p
license: Apache-2.0
contents:
  - src: bin/netp2pd
    dst: /usr/bin/netp2pd
    file_info:
      mode: 0755
  - src: bin/netp2p
    dst: /usr/bin/netp2p
    file_info:
      mode: 0755
  - src: packaging/netp2p-client.service
    dst: /lib/systemd/system/netp2p-client.service
  - src: packaging/runtime.example.yaml
    dst: /etc/netp2p/runtime.yaml
    type: config|noreplace
scripts:
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh
  postremove: packaging/postremove.sh
