# nfpm builds the DEB and RPM packages:
#
#   make package VERSION=1.0.0
#
# The binaries are produced by `make build`; the runtime config example is
# installed as a config file so upgrades never overwrite operator changes.
name: netp2p
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: NetP2P <maintainers@netp2p.example>
description: |
  Decentralized overlay VPN with a BFT committee control plane.
  The netp2pd binary runs as a manager or a client; netp2p-probe drives the
  userspace data plane in tests.
license: Apache-2.0
contents:
  - src: bin/netp2pd
    dst: /usr/bin/netp2pd
    file_info:
      mode: 0755
  - src: bin/netp2p-probe
    dst: /usr/bin/netp2p-probe
    file_info:
      mode: 0755
  - src: packaging/netp2pd.service
    dst: /lib/systemd/system/netp2pd.service
  - src: packaging/runtime.example.yaml
    dst: /etc/netp2p/runtime.yaml
    type: config|noreplace
scripts:
  postinstall: packaging/postinstall.sh
